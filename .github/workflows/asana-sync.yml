# .github/workflows/asana-sync.yml
# Asana → GitHub 태스크 연동 ([SB] 셀링부스터_PJT, 인원별 탭: 기획 이슬기 / 마케팅 안지호)
#
# 사전 준비 (1회):
#   1. Asana PAT 발급: https://app.asana.com/0/developer-console → Personal access token
#   2. GitHub 저장소 Settings → Secrets and variables → Actions → ASANA_PAT 등록
#
# 수집 방식: 검색 API 사용 — 하위 태스크 포함, 인원별 서버측 필터,
#            created_at 커서 페이지네이션으로 100건 초과분도 전량 수집.
# 매일 10:40 KST 실행 (seomonitor 10:35 직후). 수동 실행 가능 (workflow_dispatch).

name: asana-sync

on:
  schedule:
    - cron: "40 1 * * *"   # 01:40 UTC = 10:40 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Asana tasks
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: |
          python3 - << 'EOF'
          import json, os, datetime, urllib.request, urllib.parse

          WORKSPACE   = "1202264448618168"           # 헥토데이터
          PROJECT_GID = "1211763974053621"           # [SB] 셀링부스터_PJT
          PEOPLE = [
              {"gid": "1202564897923990", "name": "이슬기", "role": "기획"},
              {"gid": "1216177716600774", "name": "안지호", "role": "마케팅"},
          ]
          TOKEN = os.environ["ASANA_PAT"]
          OUT   = "SEO모니터링/data/asana-tasks.json"

          FIELDS = ("name,completed,completed_at,due_on,start_on,modified_at,created_at,resource_subtype,"
                    "memberships.section.name,memberships.project.gid,permalink_url,"
                    "custom_fields.name,custom_fields.display_value,num_subtasks,followers.name,followers.gid")

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def search_all(assignee_gid, extra):
              """검색 API + created_at 커서로 100건 초과분까지 전량 수집."""
              base = (f"https://app.asana.com/api/1.0/workspaces/{WORKSPACE}/tasks/search"
                      f"?projects.any={PROJECT_GID}&assignee.any={assignee_gid}"
                      f"&{extra}&sort_by=created_at&sort_ascending=true&limit=100"
                      f"&opt_fields={urllib.parse.quote(FIELDS)}")
              out, cursor, seen = [], None, set()
              for _ in range(50):  # 안전 상한 5,000건
                  url = base + (f"&created_at.after={urllib.parse.quote(cursor)}" if cursor else "")
                  batch = get(url)["data"]
                  fresh = [t for t in batch if t["gid"] not in seen]
                  for t in fresh: seen.add(t["gid"])
                  out += fresh
                  if len(batch) < 100 or not fresh: break
                  cursor = batch[-1]["created_at"]
              return out

          def section_of(t):
              for m in t.get("memberships") or []:
                  if (m.get("project") or {}).get("gid") == PROJECT_GID and m.get("section"):
                      return m["section"]["name"]
              return "기타"

          def shape(t, assignee_gid, owner_name):
              fields = {}
              for cf in t.get("custom_fields") or []:
                  v = cf.get("display_value")
                  if v not in (None, ""):
                      fields[cf["name"]] = v
              followers = [u["name"] for u in (t.get("followers") or [])
                           if u.get("gid") != assignee_gid and u.get("name")]
              sub = t.get("resource_subtype")
              return {
                  "gid": t["gid"],
                  "name": t.get("name") or "(무제)",
                  "type": "milestone" if sub == "milestone" else ("approval" if sub == "approval" else "task"),
                  "section": section_of(t),
                  "due_on": t.get("due_on"),
                  "start_on": t.get("start_on"),
                  "modified_at": t.get("modified_at"),
                  "owner": owner_name,
                  "completed": bool(t.get("completed")),
                  "completed_at": t.get("completed_at"),
                  "permalink": t.get("permalink_url"),
                  "fields": fields,
                  "subtasks": t.get("num_subtasks") or 0,
                  "followers": followers,
              }

          since = (datetime.date.today() - datetime.timedelta(days=30)).isoformat()
          tabs = []
          for p in PEOPLE:
              inc  = search_all(p["gid"], "completed=false")
              done = search_all(p["gid"], f"completed=true&completed_on.after={since}")
              tasks = [shape(t, p["gid"], p["name"]) for t in inc] + [shape(t, p["gid"], p["name"]) for t in done]

              # 분류=행정지원 태스크의 하위 작업을 동일 레벨로 주입 (1단계, 중복 gid 제외)
              have = {t["gid"] for t in tasks}
              admin_parents = [t for t in tasks if t["fields"].get("분류") == "행정지원" and t["subtasks"]]
              for parent in admin_parents:
                  sub_url = (f"https://app.asana.com/api/1.0/tasks/{parent['gid']}/subtasks"
                             f"?limit=100&opt_fields={urllib.parse.quote(FIELDS)}")
                  for st in get(sub_url)["data"]:
                      if st["gid"] in have: continue
                      s = shape(st, p["gid"], p["name"])
                      if s["completed"] and (s["completed_at"] or "")[:10] < since:
                          continue  # 30일 지난 완료 하위는 제외
                      s["section"] = parent["section"]          # 상위와 같은 섹션으로 묶음
                      s["fields"].setdefault("분류", "행정지원") # 필터 일관성 유지
                      s["parent_name"] = parent["name"]
                      tasks.append(s); have.add(s["gid"])
              tasks.sort(key=lambda x: (x["completed"], x["due_on"] is None, x["due_on"] or "9999", x["name"]))
              tabs.append({"gid": p["gid"], "name": p["name"], "role": p["role"], "tasks": tasks})
              print(f"{p['role']} {p['name']}: 미완료 {len(inc)} + 완료30일 {len(done)}건")

          # 공통 탭: 담당+협업(팔로워)에 두 사람이 함께 묶인 태스크 (맨 마지막 탭)
          all_names = {p["name"] for p in PEOPLE}
          common, seen = [], set()
          for tab in tabs:
              other = all_names - {tab["name"]}
              for t in tab["tasks"]:
                  if t["gid"] in seen: continue
                  if any(o in (t.get("followers") or []) for o in other):
                      common.append(dict(t)); seen.add(t["gid"])
          common.sort(key=lambda x: (x["completed"], x["due_on"] is None, x["due_on"] or "9999", x["name"]))
          tabs.append({"gid": "common", "name": "·".join(p["name"] for p in PEOPLE), "role": "공통", "tasks": common})
          print(f"공통: {len(common)}건")

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          out = {
              "generatedAt": now.isoformat(timespec="seconds"),
              "generatedBy": "github-actions/asana-sync",
              "source": {
                  "workspace": "헥토데이터",
                  "project": "[SB] 셀링부스터_PJT",
                  "projectGid": PROJECT_GID,
                  "filter": "미완료 전체 + 완료 30일, 하위 태스크 포함",
                  "viewUrl": "https://app.asana.com/1/1202264448618168/project/1211763974053621/list/1217214395642369",
              },
              "tabs": tabs,
          }
          os.makedirs(os.path.dirname(OUT), exist_ok=True)
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print("saved ->", OUT)
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "asana-sync-bot"
          git config user.email "actions@github.com"
          git add "SEO모니터링/data/asana-tasks.json"
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: asana-tasks.json 갱신 ($(date +'%Y-%m-%d %H:%M KST' -d '+9 hours'))"
            git push
          fi
