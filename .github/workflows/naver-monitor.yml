name: 네이버 블로그 발행 수집

on:
  schedule:
    - cron: '10 0 * * *'   # 매일 00:10 UTC = 09:10 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 네이버 블로그 RSS 수집
        run: |
          cat > /tmp/nv.js <<'EOF'
          const fs=require('fs'),path=require('path');
          const ID='sellingbooster';
          const DIR=path.join(process.cwd(),'SEO모니터링','data');
          const OUT=path.join(DIR,'naver.json');
          const kst=(d)=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(d);
          const load=()=>{try{return JSON.parse(fs.readFileSync(OUT,'utf8'));}catch(e){return {url:'https://blog.naver.com/'+ID,posts:[],total:0};}}
          const pick=(x,t)=>{const m=x.match(new RegExp('<'+t+'[^>]*>([\\s\\S]*?)</'+t+'>'));return m?m[1].replace(/<!\[CDATA\[|\]\]>/g,'').trim():'';};
          (async()=>{
            const data=load();
            const urls=['https://rss.blog.naver.com/'+ID+'.xml','https://blog.rss.naver.com/'+ID+'.xml'];
            let xml='';
            for(const u of urls){
              try{const r=await fetch(u,{headers:{'User-Agent':'Mozilla/5.0 (compatible; seo-monitor/1.0)'}});
                if(r.ok){const t=await r.text(); if(t.includes('<item')){xml=t;break;}}}catch(e){}
            }
            if(!xml){ data.lastRun=new Date().toISOString(); data.lastStatus='fetch_failed';
              fs.mkdirSync(DIR,{recursive:true}); fs.writeFileSync(OUT,JSON.stringify(data,null,1));
              console.log('수집 실패 — 기존 데이터 유지'); return; }
            const items=xml.split('<item').slice(1).map(s=>'<item'+s.split('</item>')[0]+'</item>');
            const map=new Map((data.posts||[]).map(p=>[p.url,p]));
            let add=0;
            for(const it of items){
              const title=pick(it,'title'), link=pick(it,'link'), pub=pick(it,'pubDate');
              if(!title||!link) continue;
              const d=pub?kst(new Date(pub)):kst(new Date());
              if(!map.has(link)) add++;
              map.set(link,{date:d,title,url:link});
            }
            data.posts=[...map.values()].sort((a,b)=>a.date<b.date?-1:1);
            data.total=data.posts.length;
            data.url='https://blog.naver.com/'+ID;
            data.lastRun=new Date().toISOString();
            data.lastStatus='ok:'+data.total;
            fs.mkdirSync(DIR,{recursive:true});
            fs.writeFileSync(OUT,JSON.stringify(data,null,1));
            console.log('수집 완료 · 신규 '+add+'건 · 누적 '+data.total+'건');
          })();
          EOF
          node /tmp/nv.js

      - name: 변경사항 커밋
        run: |
          git config user.name "seo-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "SEO모니터링/data"
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore(naver-monitor): $(date -u -d '+9 hours' +%Y-%m-%d) 수집"
          git push
