name: QA Report Sync (6h)

on:
  schedule:
    - cron: '17 */6 * * *'   # 6시간 간격 (UTC 기준 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: qa-report-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -q cryptography

      - name: Build encrypted report data
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          REPORT_PASS: ${{ secrets.REPORT_PASS }}
        run: python scripts/build_qa_report_data.py

      - name: Commit & push
        run: |
          git config user.name  "qa-report-bot"
          git config user.email "actions@github.com"
          git add QA/APP/data/qa_report.enc.json
          git diff --cached --quiet && echo "no changes" || \
            (git commit -m "chore: qa report data sync $(date -u +'%Y-%m-%dT%H:%MZ')" && git push)
