name: SEO 발행 모니터링 수집

on:
  schedule:
    - cron: '35 1 * * *'   # 매일 01:35 UTC = 10:35 KST
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright 설치 (브라우저 렌더링 수집용)
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      - name: 블로그 수집 실행
        run: node "SEO모니터링/scripts/collect.js"
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules

      - name: 변경사항 커밋
        run: |
          git config user.name "seo-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "SEO모니터링/data" "SEO모니터링/debug"
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore(seo-monitor): $(date -u +%Y-%m-%d) 수집"
          git push
