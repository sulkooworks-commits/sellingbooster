name: SEO 발행 모니터링 수집

# 반드시 저장소 루트의 .github/workflows/ 에 있어야 GitHub Actions 가 인식합니다.
# (하위 폴더에 두면 파일은 보이지만 실행되지 않습니다)

on:
  schedule:
    - cron: '5 0 * * *'   # 매일 00:05 UTC = 09:05 KST (Actions 특성상 수십 분 지연될 수 있음)
  workflow_dispatch: {}    # 저장소 Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: seo-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 블로그 수집 실행
        run: node "SEO모니터링/scripts/collect.js"

      - name: 변경사항 커밋
        run: |
          git config user.name "seo-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "SEO모니터링/data" "SEO모니터링/debug" 2>/dev/null || git add "SEO모니터링/data"
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore(seo-monitor): $(date -u -d '+9 hours' +%Y-%m-%d) 수집"
          git push
