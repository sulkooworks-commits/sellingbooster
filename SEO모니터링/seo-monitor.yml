name: SEO 발행 모니터링 수집

on:
  schedule:
    - cron: '5 0 * * *'   # 매일 00:05 UTC = 09:05 KST (Actions 특성상 수십 분 지연될 수 있음)
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 블로그 수집 실행
        run: node scripts/collect.js

      - name: 변경사항 커밋
        run: |
          git config user.name "seo-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data debug
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore(seo-monitor): $(date -u +%Y-%m-%d) 수집"
          git push
