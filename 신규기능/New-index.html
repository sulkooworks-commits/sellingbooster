<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>[SB] 기능고도화 프로토타입</title>
<style>
:root{--ink:#1b1f27;--ink2:#454f5b;--mute:#6a7381;--mute2:#9aa3af;--line:#d1d6dd;--bg:#eff1f4;--teal:#00b1bd;--teal2:#00959f;--red:#e42636}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:30px;padding:44px 40px 36px;width:min(420px,100%);box-shadow:0 20px 50px rgba(27,31,39,.08);text-align:center}
.logo{display:flex;justify-content:center;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px;margin-bottom:22px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--teal);display:inline-block}
h1{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.3px}
p{margin:0 0 22px;font-size:13px;color:var(--mute);line-height:1.6}
.row{display:flex;gap:8px}
input{flex:1;height:48px;border:1px solid var(--line);border-radius:999px;padding:0 18px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);color-scheme:light;min-width:0}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,177,189,.15)}
button{height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--teal);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--red);font-weight:600}
.fn{margin:18px 0 0;font-size:11.5px;color:var(--mute2);line-height:1.6}
.lock{width:56px;height:56px;border-radius:50%;background:#e0f6f7;color:var(--teal2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.unsup{display:none;margin-top:14px;font-size:12px;color:var(--red)}
</style></head>
<body>
<main class="card" role="dialog" aria-labelledby="t">
  <div class="logo"><i></i>Selling Booster</div>
  <div class="lock" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
  <h1 id="t">기능고도화 프로토타입</h1>
  <p>내부 검토용 화면입니다. 비밀번호를 입력하면 열립니다.</p>
  <form class="row" id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit" id="go">열기</button>
  </form>
  <div class="err" id="err" aria-live="polite"></div>
  <div class="unsup" id="unsup">이 브라우저는 복호화를 지원하지 않습니다. 최신 Chrome · Edge · Safari로 열어 주세요.</div>
  <p class="fn">열람 기록은 이 탭에만 남고 새로고침 전까지 유지됩니다 · 화면 주소 뒤 #해시는 그대로 전달됩니다</p>
</main>

  const $=id=>document.getElementById(id);
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const ok = window.crypto && crypto.subtle && typeof DecompressionStream!=='undefined';
  if(!ok){ $('unsup').style.display='block'; $('go').disabled=true; return; }
  async function unlock(pw){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    const ds=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).text();
  }
  function mount(html){ const hash=location.hash; document.open(); document.write(html); document.close(); if(hash && location.hash!==hash) location.hash=hash; }
  const saved=sessionStorage.getItem('sbproto:pw');
  if(saved){ try{ mount(await unlock(saved)); return; }catch(e){ sessionStorage.removeItem('sbproto:pw'); } }
  $('f').addEventListener('submit', async e=>{
    e.preventDefault(); const pw=$('pw').value; if(!pw) return; $('go').disabled=true; $('go').textContent='확인 중…'; $('err').textContent='';
    try{ const html=await unlock(pw); sessionStorage.setItem('sbproto:pw',pw); mount(html); }
    catch(err){ $('err').textContent='비밀번호가 맞지 않습니다.'; $('go').disabled=false; $('go').textContent='열기'; $('pw').select(); }
